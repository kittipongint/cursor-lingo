name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: c++ -std=c++17 -Wall -I core tests/layoutfix_test.cpp -o lf_test && ./lf_test

  macos:
    runs-on: macos-latest
    env:
      # Signing secrets exist only in the main repo; forks and PRs build ad-hoc.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - run: ./macos/build.sh

      - name: Notarize (release tags only)
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          ./macos/notarize.sh
          rm "$ASC_KEY_PATH"

      - run: cd build && ditto -c -k --keepParent CursorLingo.app CursorLingo-macOS.zip
      - uses: actions/upload-artifact@v4
        with: { name: CursorLingo-macOS, path: build/CursorLingo-macOS.zip }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S windows -B build/windows -A x64
      - run: cmake --build build/windows --config Release
      - name: Portable zip
        shell: pwsh
        run: |
          # A CursorLingo.ini next to the exe makes it keep its settings there (portable mode).
          New-Item -ItemType Directory -Force build/portable | Out-Null
          Copy-Item build/windows/Release/CursorLingo.exe build/portable/
          [IO.File]::WriteAllText("$PWD/build/portable/CursorLingo.ini", "", [Text.Encoding]::Unicode)
          Compress-Archive -Path build/portable/* -DestinationPath build/CursorLingo-Windows-x64-Portable.zip
      - name: Per-user installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc windows/CursorLingo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Microsoft Store package (MSIX)
        shell: pwsh
        run: |
          # Unsigned on purpose: the Store signs it. Upload this file in Partner Center; it is not for sideloading.
          $v = (Get-Item build/windows/Release/CursorLingo.exe).VersionInfo
          $version = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).0"  # the Store requires .0
          New-Item -ItemType Directory -Force build/msix | Out-Null
          Copy-Item build/windows/Release/CursorLingo.exe build/msix/
          Copy-Item -Recurse -Force windows/msix/Assets build/msix/
          (Get-Content windows/msix/AppxManifest.xml -Raw) -replace 'Version="0\.0\.0\.0"', "Version=`"$version`"" |
            Set-Content build/msix/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d build/msix /p build/CursorLingo-Store-x64.msix /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CursorLingo-Windows
          path: |
            build/CursorLingo-Windows-x64-Setup.exe
            build/CursorLingo-Windows-x64-Portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: Store-MSIX, path: build/CursorLingo-Store-x64.msix }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "CursorLingo-*", merge-multiple: true }  # not the Store MSIX
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
